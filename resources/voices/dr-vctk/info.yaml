title: DR-VCTK

type: dataset

content: audio

description: This dataset is a new variant of the voice cloning toolkit (VCTK) dataset, device-recorded VCTK (DR-VCTK), where the high-quality speech signals recorded in a semi-anechoic chamber using professional audio devices are played back and re-recorded in office environments using relatively inexpensive consumer devices

size_bytes: 3G

